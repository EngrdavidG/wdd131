<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>

    <!-- Improved Meta Description -->
   <meta name="description" content="Rate product features and share your experience through this simple user-friendly review form.">
    <meta name="author" content="David Onochie Izuogu">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
<header>
    <h1>Product Review</h1>
    <p>We value your feedback! Please share your experience with our products.</p>
</header>

<main>
    <form method="get" action="review.html">

        <!-- PRODUCT NAME -->
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <!-- RATING -->
        <fieldset>
            <legend>Overall Rating</legend>

            <label for="rating1">
                <input type="radio" id="rating1" name="rating" value="1" required> ☆
            </label>
            <label for="rating2">
                <input type="radio" id="rating2" name="rating" value="2" required> ☆☆
            </label>
            <label for="rating3">
                <input type="radio" id="rating3" name="rating" value="3" required> ☆☆☆
            </label>
            <label for="rating4">
                <input type="radio" id="rating4" name="rating" value="4" required> ☆☆☆☆
            </label>
            <label for="rating5">
                <input type="radio" id="rating5" name="rating" value="5" required> ☆☆☆☆☆
            </label>
        </fieldset>

        <!-- DATE -->
        <label for="date">Date of Installation</label>
        <input type="date" id="date" name="date" required>

        <!-- FEATURES -->
        <fieldset>
            <legend>Which features did you find useful? (Check all that apply)</legend>

            <label for="durability">
                <input type="checkbox" id="durability" name="features" value="Durability"> Durability
            </label>
            <label for="ease">
                <input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use
            </label>
            <label for="performance">
                <input type="checkbox" id="performance" name="features" value="Performance"> Performance
            </label>
            <label for="design">
                <input type="checkbox" id="design" name="features" value="Design"> Design
            </label>
        </fieldset>

        <!-- REVIEW -->
        <label for="review">Written Review (Optional)</label>
        <textarea id="review" name="review" placeholder="Share your experience with this product..."></textarea>

        <!-- NAME -->
        <label for="username">Your Name (Optional)</label>
        <input type="text" id="username" name="username" placeholder="Enter your name">

        <!-- SUBMIT -->
        <input type="submit" value="Post Review">
    </form>
</main>

<footer>
    <p>© <span id="year"></span> 💮 David Onochie Izuogu 💮 Nigeria</p>
    <p id="lastModified"></p>
</footer>
</body>
</html>
